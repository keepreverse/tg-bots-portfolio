name: quiz-bot CI

on:
  push:
    branches: [main]
    paths:
      - "quiz-bot/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "quiz-bot/**"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quiz-bot
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        run: pytest -v
